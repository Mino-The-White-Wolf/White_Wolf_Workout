name: Build White Wolf Workout APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install flet pillow

      - name: 🔨 Forge de l'APK (Validation & Nommage public)
        # Ajout du paramètre --product "White Wolf Workout" pour le nom affiché sur le téléphone
        # Ajout du paramètre --project pour le nom technique interne
        run: yes | flet build apk --project "white_wolf_workout" --product "White Wolf Workout" --org "com.shuritech.whitewolf"

      - name: 🚀 Mise à disposition de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: White-Wolf-Workout-Android
          path: build/apk/**/*.apk
